name: arrow_popup
description: A popup bubble with an arrow that points at any widget. Use it for tooltips, popovers, menus and dropdowns, with automatic placement and a controller.
version: 1.0.0
homepage: https://mrrhak.com
repository: https://github.com/mrrhak/arrow_popup
issue_tracker: https://github.com/mrrhak/arrow_popup/issues
topics:
  - popup
  - tooltip
  - overlay
  - menu
  - dropdown

# Rendered by example/tool/screenshots_test.dart.
# The first one is the square thumbnail in pub.dev search results.
screenshots:
  - description: A reaction picker that opens on long press above the like button.
    path: screenshots/0_cover.png
  - description: A menu that opens at the button and returns the picked item.
    path: screenshots/1_menu.png
  - description: Place cards on a map open on every side, flipping near the screen edges.
    path: screenshots/2_placement.png
  - description: A reaction picker opened by long press, an outlined label and a toast without an arrow.
    path: screenshots/3_style.png
  - description: A guided tour step opened from code with a controller.
    path: screenshots/4_tour.png
  - description: A hover tooltip showing a keyboard shortcut, in dark mode.
    path: screenshots/5_tooltip_dark.png
  - description: A searchable dropdown without an arrow, as wide as its field.
    path: screenshots/6_dropdown_dark.png

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
