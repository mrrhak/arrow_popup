# Fails unless pana, the tool pub.dev uses to score packages, gives the
# package the full score.
name: "Pana Check"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pana shells out to cwebp and ffprobe to check the screenshots, and
      # without them reports "No such file or directory" for every one.
      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install -y webp ffmpeg

      - name: Install pana
        run: dart pub global activate pana

      # A threshold of 0 fails the job if even one point is lost.
      - name: Score the package
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
